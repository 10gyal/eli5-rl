seed: 42

model:
  name: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  attention_implementation: sdpa
  dtype: bfloat16

data:
  max_length: 3072
  eval_fraction: 0.05
  prompt_template: |-
    Problem:
    {problem}

    Solution:

conditions:
  original:
    data_file: data/math_train_1000.jsonl
    # Use only IDs that have an accepted ELI5 response. This gives both
    # conditions the same 989 examples.
    reference_ids_file: data/math_train_1000_eli5.jsonl
    target_field: solution
    append_boxed_answer: false
    output_dir: outputs/qwen3_0.6b_sft_original

  eli5:
    data_file: data/math_train_1000_eli5.jsonl
    target_field: eli5_solution
    answer_field: answer
    append_boxed_answer: true
    output_dir: outputs/qwen3_0.6b_sft_eli5

training:
  num_train_epochs: 3
  learning_rate: 0.00002
  weight_decay: 0.1
  lr_scheduler_type: cosine
  warmup_steps: 20
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  dataloader_num_workers: 2
  optim: adamw_torch_fused
  bf16: true
  tf32: true
  report_to: none
